services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: casacontas_test
      POSTGRES_USER: casacontas_test
      POSTGRES_PASSWORD: synthetic-test-password
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casacontas_test -d casacontas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: casacontas-test-backend:local
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/casacontas_test
      POSTGRES_USER: casacontas_test
      POSTGRES_PASSWORD: synthetic-test-password
      JWT_SECRET: synthetic-test-secret-at-least-32-bytes
      JAVA_OPTS: -Xmx384m -XX:ActiveProcessorCount=2
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${E2E_APP_PORT:-3100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      start_period: 40s
      retries: 40
  frontend:
    image: casacontas-test-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:${E2E_APP_PORT:-3100}:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  test-postgres-data:
    labels:
      casacontas.test: "true"
