name: casacontas

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casacontas}
      POSTGRES_USER: ${POSTGRES_USER:-casacontas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casacontas-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-casacontas}
      POSTGRES_USER: ${POSTGRES_USER:-casacontas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casacontas-local}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-32-bytes}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 35s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "${APP_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
