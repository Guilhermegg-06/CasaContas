name: Auditoria de dependências

on:
  workflow_call:
    secrets:
      NVD_API_KEY:
        required: false
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Dependências Java
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Analisar CVEs
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY:-}" ]; then unset NVD_API_KEY; fi
          ./mvnw -B -ntp -Psecurity dependency-check:check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-java
          path: backend/target/dependency-check-report.*

  frontend:
    name: Dependências JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Auditar lockfile
        working-directory: frontend
        run: npm audit --audit-level=high
