name: Verificação do PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validar Maven Wrapper versionado
        run: |
          test "$(git ls-files -s backend/mvnw | cut -d ' ' -f 1)" = 100755
          test -x backend/mvnw
          if LC_ALL=C grep -q $'\r' backend/mvnw; then exit 1; fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verificar backend
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Validar testes por mutação
        working-directory: backend
        run: ./mvnw -B -ntp test-compile pitest:mutationCoverage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-backend
          path: |
            backend/target/site/jacoco
            backend/target/pit-reports
            backend/target/surefire-reports

  frontend:
    name: Frontend — lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Verificar frontend
        working-directory: frontend
        run: npm run verify

  navegador:
    name: Interface com API simulada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Rodar jornada responsiva
        working-directory: frontend
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: frontend/playwright-report

  integracao:
    name: Jornada real com PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validar jornada real e persistência
        run: node scripts/test-system.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jornada-real
          include-hidden-files: true
          path: |
            frontend/playwright-report-real
            frontend/test-results
            .data/evidence/*/result.txt
            .data/evidence/*/services.log
            .data/evidence/*/backup/restore-result.json
            .data/evidence/*/homolog-result.json
            .data/evidence/*/homolog-services.log

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construir imagens sem publicar
        run: docker compose build

  seguranca:
    uses: ./.github/workflows/security.yml
    secrets: inherit

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, navegador, integracao, imagens, seguranca, codeql]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publicacao-imagens.yml
