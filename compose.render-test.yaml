services:
  certificates:
    image: eclipse-temurin:21-jdk
    entrypoint: ["sh", "/create-certificates.sh"]
    volumes:
      - ./scripts/fixtures/create-test-certificates.sh:/create-certificates.sh:ro
      - certificates:/certificates
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: casacontas_render_test
      POSTGRES_USER: casacontas_test
      POSTGRES_PASSWORD: synthetic-render-password
    command:
      - sh
      - -ceu
      - |
        cp /certificates/server.key /tmp/server.key
        chown postgres:postgres /tmp/server.key
        chmod 600 /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certificates/server.crt -c ssl_key_file=/tmp/server.key
    volumes:
      - certificates:/certificates:ro
      - postgres-data:/var/lib/postgresql/data
    depends_on:
      certificates:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U casacontas_test -d casacontas_render_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: casacontas-test-backend:local
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: render
      PORT: "10000"
      DATABASE_URL: jdbc:postgresql://postgres:5432/casacontas_render_test
      POSTGRES_USER: casacontas_test
      POSTGRES_PASSWORD: synthetic-render-password
      JWT_SECRET: synthetic-render-secret-at-least-32-bytes
      CORS_ALLOWED_ORIGINS: https://frontend.example.test
      JAVA_OPTS: -Xmx384m -XX:ActiveProcessorCount=2 -Djavax.net.ssl.trustStore=/certificates/truststore.p12 -Djavax.net.ssl.trustStorePassword=synthetic-trust-password
    volumes:
      - certificates:/certificates:ro
    ports:
      - "127.0.0.1:${RENDER_TEST_PORT:-3110}:10000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10000/actuator/health"]
      interval: 3s
      timeout: 5s
      start_period: 40s
      retries: 30
volumes:
  certificates:
  postgres-data:
