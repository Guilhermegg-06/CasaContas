name: casacontas-homolog

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casacontas}
      POSTGRES_USER: ${POSTGRES_USER:-casacontas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha do banco fora do Git}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logs

  backend:
    image: ${BACKEND_IMAGE:?Defina a imagem da revisao validada pelo digest}
    environment:
      SPRING_PROFILES_ACTIVE: homolog
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-casacontas}
      POSTGRES_USER: ${POSTGRES_USER:-casacontas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha do banco fora do Git}
      JWT_SECRET: ${JWT_SECRET:?Defina uma chave aleatoria de pelo menos 32 bytes}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Defina a origem HTTPS exata da interface}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30
    restart: unless-stopped
    logging: *logs

  frontend:
    image: ${FRONTEND_IMAGE:?Defina a imagem da mesma revisao pelo digest}
    ports:
      - "127.0.0.1:${HOMOLOG_APP_PORT:-3101}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logs

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:?Defina um nome fixo para o volume persistente}
