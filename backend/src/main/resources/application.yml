spring:
  application:
    name: casacontas-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/casacontas}
    username: ${POSTGRES_USER:casacontas}
    password: ${POSTGRES_PASSWORD:change-me-locally}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: never
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /docs
  swagger-ui.version: '@swagger-ui.version@'
casacontas:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-this-32-bytes}
    access-token-ttl: PT10M
    refresh-token-ttl: P30D
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
logging.structured.format.console: logstash
